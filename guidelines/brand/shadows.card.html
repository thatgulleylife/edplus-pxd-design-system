<!-- @dsCard group="Brand" viewport="700x160" name="Shadows" subtitle="Shadow scale from xs to 2xl with maroon tint on hover" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #f5f5f7; font-family: var(--font-sans); padding: 24px; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .card { background: #fff; border-radius: 14px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; }
  .name { font-size: 11px; font-weight: 700; color: #7d7d85; letter-spacing: 0.04em; }
  .val { font-size: 10px; color: #adadb3; font-family: monospace; }
</style>
</head><body>
<div class="row">
  <div class="card" style="box-shadow:0 1px 2px 0 rgba(0,0,0,.05)"><div class="name">xs</div><div class="val">1px 2px</div></div>
  <div class="card" style="box-shadow:0 2px 8px rgba(140,29,64,.05)"><div class="name">sm</div><div class="val">maroon tint</div></div>
  <div class="card" style="box-shadow:0 10px 40px rgba(0,0,0,.08)"><div class="name">md · default</div><div class="val">10px 40px</div></div>
  <div class="card" style="box-shadow:0 20px 60px rgba(140,29,64,.18)"><div class="name">lg · hover</div><div class="val">maroon 18%</div></div>
  <div class="card" style="box-shadow:0 34px 64px -30px rgba(20,20,30,.42)"><div class="name">xl · card</div><div class="val">deep dark</div></div>
  <div class="card" style="box-shadow:0 60px 120px -34px rgba(60,10,30,.55)"><div class="name">2xl · modal</div><div class="val">deep maroon</div></div>
</div>
</body></html>
