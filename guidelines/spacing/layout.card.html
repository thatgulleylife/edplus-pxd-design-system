<!-- @dsCard group="Spacing" viewport="700x150" name="Layout Constants" subtitle="Page widths, padding, and grid gaps" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #fff; font-family: var(--font-sans); padding: 16px 20px; }
  .items { display: flex; gap: 12px; flex-wrap: wrap; }
  .item { background: #f5f5f7; border: 1px solid #ececef; border-radius: 10px; padding: 12px 16px; }
  .item .val { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: #b01e54; }
  .item .name { font-size: 11px; font-weight: 700; color: #7d7d85; margin-top: 3px; font-family: "JetBrains Mono", monospace; }
  .item .desc { font-size: 11px; color: #3a3a3c; margin-top: 2px; }
</style>
</head><body>
<div class="items">
  <div class="item"><div class="val">1280px</div><div class="name">--maxw</div><div class="desc">Page max-width</div></div>
  <div class="item"><div class="val">1120px</div><div class="name">--maxw-narrow</div><div class="desc">Leader page max</div></div>
  <div class="item"><div class="val">56px</div><div class="name">--wrap-pad</div><div class="desc">H-padding desktop</div></div>
  <div class="item"><div class="val">24px</div><div class="name">--wrap-pad-sm</div><div class="desc">H-padding mobile</div></div>
  <div class="item"><div class="val">16px</div><div class="name">--grid-gap</div><div class="desc">Team/bento grid</div></div>
  <div class="item"><div class="val">26px</div><div class="name">--grid-gap-lg</div><div class="desc">Leader cards</div></div>
  <div class="item"><div class="val">96px</div><div class="name">--section-gap</div><div class="desc">Section spacing</div></div>
</div>
</body></html>
