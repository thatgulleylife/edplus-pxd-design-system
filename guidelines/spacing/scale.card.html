<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4pt grid: base tokens sp-1 through sp-24" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: #fff; font-family: var(--font-sans); padding: 16px 20px; }
  .row { display: flex; align-items: flex-end; gap: 6px; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .bar { background: #b01e54; border-radius: 3px; width: 28px; }
  .label { font-size: 9.5px; color: #7d7d85; font-family: "JetBrains Mono", monospace; text-align: center; }
  .px { font-size: 9px; color: #adadb3; text-align: center; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
</head><body>
<div class="row">
  <div class="item"><div class="bar" style="height:4px"></div><div class="label">1</div><div class="px">4px</div></div>
  <div class="item"><div class="bar" style="height:8px"></div><div class="label">2</div><div class="px">8px</div></div>
  <div class="item"><div class="bar" style="height:12px"></div><div class="label">3</div><div class="px">12px</div></div>
  <div class="item"><div class="bar" style="height:16px"></div><div class="label">4</div><div class="px">16px</div></div>
  <div class="item"><div class="bar" style="height:20px"></div><div class="label">5</div><div class="px">20px</div></div>
  <div class="item"><div class="bar" style="height:24px"></div><div class="label">6</div><div class="px">24px</div></div>
  <div class="item"><div class="bar" style="height:28px"></div><div class="label">7</div><div class="px">28px</div></div>
  <div class="item"><div class="bar" style="height:32px"></div><div class="label">8</div><div class="px">32px</div></div>
  <div class="item"><div class="bar" style="height:40px;opacity:.85"></div><div class="label">10</div><div class="px">40px</div></div>
  <div class="item"><div class="bar" style="height:48px;opacity:.8"></div><div class="label">12</div><div class="px">48px</div></div>
  <div class="item"><div class="bar" style="height:56px;opacity:.75"></div><div class="label">14</div><div class="px">56px</div></div>
  <div class="item"><div class="bar" style="height:64px;opacity:.7"></div><div class="label">16</div><div class="px">64px</div></div>
  <div class="item"><div class="bar" style="height:80px;opacity:.65"></div><div class="label">20</div><div class="px">80px</div></div>
  <div class="item"><div class="bar" style="height:96px;opacity:.6"></div><div class="label">24</div><div class="px">96px</div></div>
</div>
</body></html>
