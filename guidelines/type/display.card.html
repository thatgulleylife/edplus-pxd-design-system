<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: #fff; font-family: var(--font-sans); padding: 20px 24px 16px; }
  .hero-sample { font-size: 52px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.94; color: #1a1a1c; }
  .hero-sample .accent { color: #b01e54; }
  .meta { margin-top: 14px; display: flex; gap: 20px; flex-wrap: wrap; }
  .meta span { font-size: 11px; color: #7d7d85; font-family: "JetBrains Mono", monospace; background: #f5f5f7; padding: 3px 8px; border-radius: 5px; }
</style>
</head><body>
<div class="hero-sample">Product &amp; Experience <span class="accent">Design</span></div>
<div class="meta">
  <span>Plus Jakarta Sans 800</span>
  <span>letter-spacing: -0.045em</span>
  <span>line-height: 0.94</span>
  <span>color: --ink</span>
  <span>accent: --color-maroon</span>
</div>
</body></html>
