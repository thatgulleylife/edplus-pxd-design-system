<!-- @dsCard group="Colors" viewport="700x160" name="Maroon — Primary" subtitle="Brand accent: maroon scale + soft tint" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: #fff; font-family: var(--font-sans); }
  .row { display: flex; gap: 0; height: 100px; }
  .swatch { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 14px; }
  .swatch span { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
  .swatch small { font-size: 10px; opacity: 0.7; margin-top: 1px; }
  .meta { display: flex; gap: 32px; padding: 14px 16px 10px; }
  .meta p { font-size: 11px; color: #7d7d85; font-family: var(--font-mono); }
</style>
</head><body>
<div class="row">
  <div class="swatch" style="background:#fbeef3"><span style="color:#b01e54">Soft</span><small style="color:#b01e54">#fbeef3</small></div>
  <div class="swatch" style="background:#f4c7d5"><span style="color:#7c1438">Pale</span><small style="color:#7c1438">#f4c7d5</small></div>
  <div class="swatch" style="background:#c9285f"><span style="color:#fff">Mid</span><small style="color:rgba(255,255,255,.7)">#c9285f</small></div>
  <div class="swatch" style="background:#b01e54"><span style="color:#fff">Accent</span><small style="color:rgba(255,255,255,.7)">#b01e54</small></div>
  <div class="swatch" style="background:#8c1d40"><span style="color:#fff">Legacy</span><small style="color:rgba(255,255,255,.7)">#8c1d40</small></div>
  <div class="swatch" style="background:#7c1438"><span style="color:#fff">Deep</span><small style="color:rgba(255,255,255,.7)">#7c1438</small></div>
  <div class="swatch" style="background:#5c0f29"><span style="color:#fff">Deeper</span><small style="color:rgba(255,255,255,.7)">#5c0f29</small></div>
  <div class="swatch" style="background:linear-gradient(140deg,#b01e54,#7c1438); flex:1.4"><span style="color:#fff">Gradient</span><small style="color:rgba(255,255,255,.7)">primary usage</small></div>
</div>
</body></html>
