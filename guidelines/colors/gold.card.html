<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: #fff; font-family: var(--font-sans); }
  .row { display: flex; gap: 0; height: 100px; }
  .swatch { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 14px; }
  .swatch span { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
  .swatch small { font-size: 10px; opacity: 0.8; margin-top: 1px; }
  .tags { display: flex; gap: 8px; padding: 12px 16px; }
  .tag { font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 700; }
</style>
</head><body>
<div class="row">
  <div class="swatch" style="background:#fdf3cf"><span style="color:#7a5a12">Soft</span><small style="color:#7a5a12">#fdf3cf</small></div>
  <div class="swatch" style="background:#f5d87a"><span style="color:#7a5a12">Pale</span><small style="color:#7a5a12">#f5d87a</small></div>
  <div class="swatch" style="background:#e9b53a"><span style="color:#7a5a12">Gold</span><small style="color:#7a5a12">#e9b53a — homepage</small></div>
  <div class="swatch" style="background:#ffc627"><span style="color:#7a5a12">ASU Gold</span><small style="color:#7a5a12">#ffc627 — official</small></div>
  <div class="swatch" style="background:#d7a109"><span style="color:#fff">Dim</span><small style="color:rgba(255,255,255,.75)">#d7a109</small></div>
  <div class="swatch" style="background:#7a5a12"><span style="color:#fff">Ink</span><small style="color:rgba(255,255,255,.75)">#7a5a12 — text on gold</small></div>
</div>
<div class="tags">
  <span class="tag" style="background:#fdf3cf;color:#7a5a12">ASU Alumni</span>
  <span class="tag" style="background:#ffc627;color:#7a5a12;border:1.5px solid #f1d488">Badge</span>
  <span class="tag" style="background:#e9b53a;color:#fff">Achievement</span>
</div>
</body></html>
