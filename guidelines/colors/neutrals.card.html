<!-- @dsCard group="Colors" viewport="700x160" name="Neutrals" subtitle="Ink, muted, border, and surface neutrals" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: #fff; font-family: var(--font-sans); }
  .row { display: flex; gap: 0; height: 80px; }
  .swatch { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 12px; }
  .swatch span { font-size: 10.5px; font-weight: 700; }
  .swatch small { font-size: 9.5px; opacity: 0.7; margin-top: 1px; font-family: var(--font-mono); }
  .usage { display: flex; gap: 16px; padding: 12px 16px; align-items: center; flex-wrap: wrap; }
  .usage p { font-size: 11px; color: #7d7d85; }
  .sample-text { font-size: 13px; font-weight: 600; }
</style>
</head><body>
<div class="row">
  <div class="swatch" style="background:#1a1a1c"><span style="color:#fff">Ink</span><small style="color:rgba(255,255,255,.6)">#1a1a1c</small></div>
  <div class="swatch" style="background:#3a3a3c"><span style="color:#fff">Ink-2</span><small style="color:rgba(255,255,255,.6)">#3a3a3c</small></div>
  <div class="swatch" style="background:#7d7d85"><span style="color:#fff">Muted</span><small style="color:rgba(255,255,255,.7)">#7d7d85</small></div>
  <div class="swatch" style="background:#ececef;border:1px solid #ddd"><span style="color:#3a3a3c">Line</span><small style="color:#7d7d85">#ececef</small></div>
  <div class="swatch" style="background:#f3f3f5;border:1px solid #ddd"><span style="color:#3a3a3c">Line-2</span><small style="color:#7d7d85">#f3f3f5</small></div>
  <div class="swatch" style="background:#f5f5f7;border:1px solid #ddd"><span style="color:#3a3a3c">BG Soft</span><small style="color:#7d7d85">#f5f5f7</small></div>
  <div class="swatch" style="background:#faf9f6;border:1px solid #ddd"><span style="color:#3a3a3c">BG Warm</span><small style="color:#7d7d85">#faf9f6</small></div>
  <div class="swatch" style="background:#fff;border:1px solid #ddd"><span style="color:#3a3a3c">White</span><small style="color:#7d7d85">#ffffff</small></div>
</div>
<div class="usage">
  <span class="sample-text" style="color:#1a1a1c">Primary text</span>
  <span class="sample-text" style="color:#3a3a3c">Secondary text</span>
  <span class="sample-text" style="color:#7d7d85">Captions & meta</span>
  <span style="font-size:11px;padding:3px 10px;background:#f5f5f7;border:1px solid #ececef;border-radius:6px;color:#3a3a3c">Surface chip</span>
</div>
</body></html>
