<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<!-- @template name="Leader Page" description="Full leader page composed from design system components — hero, context, focus areas, stats, roster, and support" -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="./ds-base.js"></script>

<style>
  /* Page shell only — every section below is a design system component.
     Grid values come from tokens, so this stays in step with
     DESIGN-CONVENTIONS.md (1280px column, 56px gutter, 24px on mobile).
     The previous version of this template hardcoded a stale 1120px wrap. */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg, #fff); color: var(--ink, #1a1a1c);
         font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: var(--maxw, 1280px); margin: 0 auto; padding: 0 var(--wrap-pad, 56px); }
  @media (max-width: 680px) { .wrap { padding: 0 var(--wrap-pad-sm, 24px); } }
</style>

<div id="root"></div>

<script type="text/babel">
  const DS = (window.EdPlusPXDDesignSystem_d81422 ||
              window[Object.keys(window).find(function (k) {
                return k.indexOf('EdPlusPXDDesignSystem_') === 0;
              })]);

  const { Nav, LeaderHero, LeaderContext, FocusGrid, StatsHero, TeamRoster, SupportStrip, SiteFooter } = DS;

  /**
   * Leader Page
   * Composed entirely from design system components — this template holds no
   * section markup of its own, so it picks up every component fix automatically.
   * Section order mirrors the live leader page.
   *
   * All content is generic placeholder. Pass real copy in as props at use time;
   * never bake real names, photos, or headcounts into this file.
   */
  function LeaderPage() {
    return (
      <>
        <Nav />
        <main className="wrap">
          <LeaderHero />
          <LeaderContext />
          <FocusGrid />
          <StatsHero />
          <TeamRoster />
          <SupportStrip />
        </main>
        <SiteFooter />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<LeaderPage />);
</script>

</body>
</html>
